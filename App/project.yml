# Xcode project for the PalMeet app bundle. Regenerate with: xcodegen generate --spec App/project.yml
# The modules live in the Swift package at the repo root (product PalMeetKit); tests run with `swift test`.
name: PalMeet
options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  PalMeetPackage:
    path: ..
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.4.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PalMeet:
    type: application
    platform: macOS
    sources:
      - path: ../Sources/PalMeet
      - path: ../Resources/Assets.xcassets
      - path: ../Resources/AppIcon.icns
        buildPhase: resources
      - path: ../Extension/chromium
        type: folder
        buildPhase: resources
        name: ChromeExtension
    settings:
      base:
        PRODUCT_NAME: PalMeet
        PRODUCT_BUNDLE_IDENTIFIER: app.palmeet.PalMeet
        INFOPLIST_FILE: ../Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ../Resources/PalMeet.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
    scheme: {}
    dependencies:
      - package: PalMeetPackage
        product: PalMeetKit
      - package: KeyboardShortcuts
      - package: Sparkle
